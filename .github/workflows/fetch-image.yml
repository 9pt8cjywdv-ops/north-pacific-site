name: Add a background image
# Downloads a free-licence photo (Unsplash only), resizes it for the web, and commits it as ocean.jpg.
on:
  workflow_dispatch:
    inputs:
      url: { description: 'images.unsplash.com photo URL', required: true }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { URL: '${{ inputs.url }}' }
        run: |
          set -euo pipefail
          echo "$URL" | grep -Eq '^https://images\.unsplash\.com/photo-[A-Za-z0-9-]+(\?.*)?$' || { echo "Only images.unsplash.com photo URLs"; exit 1; }
          # Unsplash resizes and compresses on its side.
          curl -sfL --max-time 60 "${URL%%\?*}?fm=jpg&q=60&w=2400&fit=max" -o ocean.jpg
          file ocean.jpg | grep -q JPEG || { echo "Download is not a JPEG"; exit 1; }
          ls -la ocean.jpg
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocean.jpg && git commit -m "Background photo: Ran Ding on Unsplash (Unsplash License)" && git push
